kind = "web"
previewPath = "/"
title = "Hudson Valley Chimney Help"
version = "1.0.0"
id = "artifacts/hv-chimney"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24143

[services.development]
run = "pnpm --filter @workspace/hv-chimney run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hv-chimney", "run", "build" ]
publicDir = "artifacts/hv-chimney/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24143"
BASE_PATH = "/"
